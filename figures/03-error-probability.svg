<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="940" viewBox="0 0 1672 940"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03070d"/><stop offset=".72" stop-color="#0b1520"/><stop offset="1" stop-color="#020508"/></linearGradient><linearGradient id="lime"><stop stop-color="#c7ff25"/><stop offset="1" stop-color="#80ba08"/></linearGradient></defs><rect width="1672" height="940" fill="url(#bg)"/><g stroke="#8ee819" opacity=".2"><path d="M650 0 L200 940 M1100 0 L650 940 M1500 0 L1000 940"/></g><path d="M0 104 H1672" stroke="#c7ff25" stroke-width="4"/><text x="65" y="75" font-size="62" font-family="DejaVu Sans,Arial" font-weight="bold" fill="#c0ff23">RAW</text><text x="225" y="75" font-size="62" font-family="DejaVu Sans,Arial" font-weight="bold" fill="#d2d6da">POWERED</text><path d="M615 27 V80" stroke="#d5ff2a" stroke-width="3"/><text x="655" y="72" font-size="32" font-family="DejaVu Sans,Arial" fill="#dfe8eb" letter-spacing="4">RESEARCH</text><text x="1210" y="73" font-size="22" font-family="DejaVu Sans,Arial" fill="#fff">FRONTIER RESEARCH / 026</text><path d="M1210 88 H1590" stroke="#c7ff25"/><text x="65" y="181" font-family="DejaVu Sans,Arial" font-size="58" font-weight="bold" fill="url(#lime)">MATHEMATICS OF DRIFT AND ERROR</text><text x="66" y="223" font-family="DejaVu Sans,Arial" font-size="27" font-style="italic" fill="#d4dadd">Error incidence, correction, and measurable growth</text><path d="M73 259 H772 L792 279 V805 L773 824 H65 L48 806 V284Z" fill="#09141c" stroke="#b9ee31" stroke-width="3"/><path d="M71 271 H764" stroke="#fff" opacity=".28"/><text x="78" y="304" font-family="DejaVu Sans,Arial" font-weight="bold" font-size="24" fill="#b9ff21">1.</text><text x="131" y="304" font-family="DejaVu Sans,Arial" font-weight="bold" font-size="23" fill="#fff">MODEL A / FIRST-ERROR RISK</text><text x="76" y="355" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">P(any error by T) = 1 − ∏ₜ₌₁ᵀ(1 − hₜ)</text><text x="76" y="391" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">Constant hazard: P(T) = 1 − (1 − h)ᵀ</text><text x="76" y="427" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">If h = 1% and T = 50: P(T) ≈ 39.5%.</text><text x="76" y="463" font-family="DejaVu Sans,Arial" font-size="22" fill="#b9ff21">→ NOT a 39.5% per-turn hallucination rate.</text><path d="M867 259 H1604 L1624 279 V508 L1605 527 H859 L842 509 V284Z" fill="#09141c" stroke="#b9ee31" stroke-width="3"/><path d="M865 271 H1596" stroke="#fff" opacity=".28"/><text x="872" y="304" font-family="DejaVu Sans,Arial" font-weight="bold" font-size="24" fill="#b9ff21">2.</text><text x="925" y="304" font-family="DejaVu Sans,Arial" font-weight="bold" font-size="23" fill="#fff">MODEL B / RECOVERY</text><text x="870" y="355" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">dₜ₊₁ = (1 − r)dₜ + h(1 − dₜ)</text><text x="870" y="391" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">Long-run active drift: d* = h / (h + r)</text><text x="870" y="427" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">h = wrong-state entry; r = recovery probability.</text><path d="M867 544 H1604 L1624 564 V805 L1605 824 H859 L842 806 V569Z" fill="#09141c" stroke="#b9ee31" stroke-width="3"/><path d="M865 556 H1596" stroke="#fff" opacity=".28"/><text x="872" y="589" font-family="DejaVu Sans,Arial" font-weight="bold" font-size="24" fill="#b9ff21">3.</text><text x="925" y="589" font-family="DejaVu Sans,Arial" font-weight="bold" font-size="23" fill="#fff">MEASUREMENT RATE</text><text x="870" y="640" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">H(L) = unsupported claims / checkable claims</text><text x="870" y="676" font-family="DejaVu Sans,Arial" font-size="22" fill="#e7edf0">g = [H(L₂) − H(L₁)] × 10,000 / (L₂ − L₁)</text><text x="870" y="712" font-family="DejaVu Sans,Arial" font-size="22" fill="#b9ff21">→ Report percentage points, CIs, and grading rules.</text><path d="M50 855 H1608 L1635 878 L1615 911 H42 L22 887 Z" fill="#09141b" stroke="#bcff24" stroke-width="4"/><text x="78" y="892" font-family="DejaVu Sans,Arial" font-weight="bold" font-size="23" fill="#c4ff29">TAKEAWAY  /  These are illustrative frameworks, not measured model constants.</text><text x="1478" y="928" font-family="DejaVu Sans,Arial" font-size="14" fill="#a0afb3">RAWPOWERED / 2026</text></svg>